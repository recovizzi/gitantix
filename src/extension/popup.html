<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gitantix</title>
<style>
  :root { color-scheme: light dark; --muted: #59636e; }
  @media (prefers-color-scheme: dark) { :root { --muted: #9198a1; } }
  html, body { margin: 0; }
  /* the popup window follows the body size (browsers cap it at 800 × 600) */
  body { position: relative; width: 420px; height: 560px; overflow: hidden; }
  .gx-host { position: absolute; inset: 0; }
  /* resize grips at the bottom corners (the popup hangs from the toolbar icon) */
  .grip { position: absolute; left: 0; bottom: 0; width: 14px; height: 14px; cursor: nesw-resize; z-index: 2; opacity: .5;
    background: linear-gradient(45deg, transparent 0 45%, var(--muted) 45% 52%, transparent 52% 65%, var(--muted) 65% 72%, transparent 72%); }
  .grip:hover { opacity: 1; }
  .grip-r { left: auto; right: 0; cursor: nwse-resize; transform: scaleX(-1); }
</style>
</head>
<body>
<div class="grip" data-dir="-1" title="Drag to resize"></div>
<div class="grip grip-r" data-dir="1" title="Drag to resize"></div>
<script src="popup.js"></script>
</body>
</html>
