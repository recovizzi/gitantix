<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gitantix</title>
<style>
  :root { --fg:#1f2328; --muted:#59636e; --bg:#fff; --bg-muted:#f6f8fa; --border:#d1d9e0; --accent:#0969da; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f0f6fc; --muted:#9198a1; --bg:#0d1117; --bg-muted:#151b23; --border:#3d444d; --accent:#4493f8; } }
  body { margin:0; width:280px; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; align-items:center; gap:8px; padding:12px 16px; background:var(--bg-muted); border-bottom:1px solid var(--border); font-weight:600; }
  header img { width:20px; height:20px; }
  form { padding:12px 16px 16px; display:grid; gap:12px; }
  label { display:grid; gap:4px; font-weight:600; }
  select { font:inherit; font-weight:400; padding:5px 8px; color:var(--fg); background:var(--bg); border:1px solid var(--border); border-radius:6px; }
  select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .check { display:flex; align-items:center; gap:8px; font-weight:400; }
  .hint { color:var(--muted); font-size:12px; font-weight:400; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header><img src="icons/32.png" alt=""> Gitantix</header>
<form>
  <label>Style
    <select name="flavor"><option value="github">GitHub</option><option value="gitlab">GitLab</option></select>
  </label>
  <label>Theme
    <select name="mode"><option value="auto">Follow system</option><option value="light">Light</option><option value="dark">Dark</option></select>
  </label>
  <label class="check"><input type="checkbox" name="disguise"> Disguise the games</label>
  <span class="hint">Open <a href="https://cemantix.certitudes.org/" target="_blank">Cémantix</a> or <a href="https://pedantix.certitudes.org/" target="_blank">Pédantix</a>.</span>
</form>
<script src="popup.js"></script>
</body>
</html>
