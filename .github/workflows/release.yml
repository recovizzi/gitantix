# Builds the release packages for a version tag and publishes them on a GitHub release page.
# Run it by hand: Actions → Release → Run workflow, and enter the tag.
#   1. bump "version" in package.json (the manifest takes it from there), commit
#   2. git tag v0.2.0 && git push origin v0.2.0
#   3. run this workflow with tag v0.2.0
#
# The release page gets three files:
#   gitantix-chrome-<version>.crx    drag onto chrome://extensions (Linux; Windows and macOS
#                                  only allow off-store .crx via enterprise policy)
#   gitantix-chrome-<version>.zip    unzip, then chrome://extensions → Load unpacked (any OS)
#   gitantix-firefox-<version>.xpi   signed by Mozilla, installs by opening it in Firefox
#
# The .crx is signed with the CHROME_CRX_KEY repository secret (a PEM private key). The key
# fixes the extension ID, so keep using the same one: a new key means a new extension.
#
# Firefox signing uses AMO's "unlisted" channel (self-distribution): Mozilla signs the
# file without listing it on addons.mozilla.org. Needs the MOZILLA_API_KEY and
# MOZILLA_API_SECRET repository secrets (addons.mozilla.org → Developer Hub → API keys).
# AMO accepts each version number once, so every run needs a new version.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v0.2.0 (must already be pushed)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "$TAG" ]; then
            echo "::error::Tag $TAG and package.json $pkg must match"
            exit 1
          fi
          echo "VERSION=$pkg" >> "$GITHUB_ENV"

      - run: pnpm build
      - run: pnpm lint

      # content.js is bundled by esbuild, so AMO wants the readable sources too.
      - name: Archive the sources for AMO
        run: git archive --format=zip --output "$RUNNER_TEMP/source.zip" HEAD

      - name: Sign the Firefox package
        env:
          WEB_EXT_API_KEY: ${{ secrets.MOZILLA_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.MOZILLA_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::MOZILLA_API_KEY and MOZILLA_API_SECRET secrets must be set"
            exit 1
          fi
          pnpm exec web-ext sign \
            --source-dir dist/extension-firefox \
            --artifacts-dir signed \
            --channel unlisted \
            --upload-source-code "$RUNNER_TEMP/source.zip" \
            --approval-timeout 1800000

      - name: Pack the Chrome .crx
        env:
          CHROME_CRX_KEY: ${{ secrets.CHROME_CRX_KEY }}
        run: |
          if [ -z "$CHROME_CRX_KEY" ]; then
            echo "::error::CHROME_CRX_KEY secret must be set"
            exit 1
          fi
          mkdir -p release
          umask 077
          printf '%s\n' "$CHROME_CRX_KEY" > "$RUNNER_TEMP/crx-key.pem"
          pnpm exec crx3 -p "$RUNNER_TEMP/crx-key.pem" -o release/gitantix-chrome-$VERSION.crx -- dist/extension
          rm "$RUNNER_TEMP/crx-key.pem"

      - name: Collect the release files
        run: |
          mkdir -p release
          cp dist/gitantix-extension.zip release/gitantix-chrome-$VERSION.zip
          xpi=$(ls signed/*.xpi)
          cp "$xpi" release/gitantix-firefox-$VERSION.xpi
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: gitantix-${{ inputs.tag }}
          path: release/*

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Install

          **Chrome / Edge / Brave on Windows or macOS:** download \`gitantix-chrome-$VERSION.zip\` and unzip it. Open \`chrome://extensions\`, turn on **Developer mode** and click **Load unpacked**, then pick the unzipped folder. (These platforms only accept a \`.crx\` from the Chrome Web Store or through an enterprise policy.)

          **Chrome / Chromium on Linux:** download \`gitantix-chrome-$VERSION.crx\` and drag it onto \`chrome://extensions\`.

          **Firefox (142+):** download \`gitantix-firefox-$VERSION.xpi\` and open it in Firefox (or drag it onto a Firefox window), then click **Add**. Mozilla signed it, so it stays installed after a restart.
          EOF
          gh release create "$TAG" release/* --verify-tag --title "$TAG" --notes-file notes.md --generate-notes
